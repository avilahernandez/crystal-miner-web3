<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Miner SPA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.0/ethers.umd.min.js"></script>
</head>
<body>
    <div class="scanlines"></div>
    <header>
        <h1>CRYSTAL MINER v1.0</h1>
        <div style="display: flex; gap: 10px;">
            <!-- Botón de reinicio para pruebas -->
            <button id="resetBtn" style="color: #ffaa00;">[RESET]</button>
            <button id="connectBtn">[ [CONECTAR WALLET] ]</button>
        </div>
    </header>

    <main>
        <div class="crystal-container">
            <button id="crystalBtn">
                <svg viewBox="0 0 200 200">
                    <polygon points="100,10 40,90 100,190" stroke="#00ffff" />
                    <polygon points="100,10 40,90 60,110 100,190" stroke="#00ffff" stroke-dasharray="4" />
                    <line x1="100" y1="10" x2="100" y2="190" stroke="#00ffff" />
                    <line x1="40" y1="90" x2="100" y2="130" stroke="#00ffff" />
                    <polygon points="100,10 160,70 100,190" stroke="#ff00ff" />
                    <polygon points="100,10 160,70 140,130 100,190" stroke="#ff00ff" stroke-dasharray="4" />
                    <line x1="160" y1="70" x2="100" y2="130" stroke="#ff00ff" />
                </svg>
            </button>
            <div class="counter">
                <p id="gemPoints">0</p>
                <p>GEMPOINTS</p>
            </div>
        </div>

        <div class="energy-bar">
            <span>ENERGIA: [##########---]</span>
            <span>85%</span>
        </div>

        <div class="status-panel">
            <h2>=== ESTADO DEL JUGADOR ===</h2>
            <div class="row"><span>$QUEST BALANCE:</span> <span id="questBalance">0.00</span></div>
            <div class="row"><span>NIVEL ACTUAL:</span> <span id="level">BRONCE</span></div>
            <div class="row"><span>PUNTOS ACUM:</span> <span id="progress">0 / 100</span></div>
        </div>

        <button id="refineBtn" disabled>[ REFINAR ]</button>

        <div class="upgrades">
            <button>[+ PICO LVL.5]<br>5000 GEM</button>
            <button>[AUTO-MINER]<br>15K GEM</button>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
